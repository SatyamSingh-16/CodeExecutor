# Upstream for the Go API server
upstream api_backend {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Enforce reasonable request body size matching API cap (1 MB limit + headers)
    client_max_body_size 2M;

    # Dedicated location for Server-Sent Events (SSE) streaming endpoint:
    # GET /api/submissions/:id/stream
    location ~ ^/api/submissions/[^/]+/stream$ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Clear Connection header to enable HTTP/1.1 keepalive with upstream
        proxy_set_header Connection "";

        # Standard reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: Disable proxy buffering and caching for real-time SSE event delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long-lived timeouts compatible with application keepalive heartbeat (15s default)
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check endpoints
    location ~ ^/(health|healthz)$ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Standard API endpoints
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard reverse proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable standard proxy buffering for standard request/response endpoints
        proxy_buffering on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Default fallback: reject all unmapped paths
    location / {
        return 404 "Not Found\n";
    }
}
