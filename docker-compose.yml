services:
  # ============================================================================
  # 1. Nginx Reverse Proxy (Public Entry Point)
  # ============================================================================
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: code-executor-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. Go API Server (Private Backend)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: code-executor-api
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://code_executor:code_executor_dev_secret_change_me@postgres:5432/code_execution_db?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-submissions:stream}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-worker_group}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-key-minimum-32-chars!}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      RATE_LIMIT: ${RATE_LIMIT:-20}
      RATE_WINDOW_SECONDS: ${RATE_WINDOW_SECONDS:-60}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. Background Worker Pool (Isolated Execution Daemon)
  # ============================================================================
  # SECURITY NOTICE: The Docker socket (/var/run/docker.sock) is mounted ONLY
  # into the worker container to permit sandboxed ephemeral container orchestration.
  # The socket is NOT mounted into nginx, api, postgres, or redis.
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: code-executor-worker
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://code_executor:code_executor_dev_secret_change_me@postgres:5432/code_execution_db?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-submissions:stream}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-worker_group}
      WORKER_CONSUMER_NAME: ${WORKER_CONSUMER_NAME:-worker-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 4. PostgreSQL Database (Authoritative Source of Truth)
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: code-executor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-code_execution_db}
      POSTGRES_USER: ${POSTGRES_USER:-code_executor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-code_executor_dev_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-code_executor} -d ${POSTGRES_DB:-code_execution_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 5. Redis (Queue, Rate Limiter, Ephemeral Pub/Sub)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: code-executor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

# ==============================================================================
# Networks & Volumes
# ==============================================================================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
